name: PDF citation extraction
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  offline-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation -v
